<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>排名变化数据可视化</title>
    <!-- D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Top Controls -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">🌓 主题</button>
    <button class="fullscreen-toggle" onclick="toggleFullscreen()" id="fullscreenBtn">全屏</button>
    <button class="fullscreen-exit" id="fullscreenExitBtn">退出全屏</button>
    <button class="config-toggle" onclick="toggleConfig()">⚙️ 配置</button>

    <!-- Configuration Panel -->
    <div class="config-panel" id="configPanel">
      <div class="config-header">
        <h2>图表配置</h2>
        <button class="config-close" onclick="toggleConfig()">×</button>
      </div>
      <div class="config-content">
        <form id="configForm" onsubmit="handleSubmit(event)">
          <!-- Actions -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">操作</div>
            <div class="config-section-content">
              <button type="submit" class="btn-primary">应用配置</button>
              <div style="margin-top: 10px">
                <button type="button" class="btn-secondary" onclick="exportConfig(window.CONFIG)">导出JSON</button>
                <button type="button" class="btn-secondary" onclick="loadConfig()">从文件加载</button>
                <input type="file" id="configFileInput" accept=".json" style="display: none" onchange="handleFileLoad(event)" />
              </div>
            </div>
          </div>



          <!-- Basic Info -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">基础信息</div>
            <div class="config-section-content">
              <div class="form-group">
                <label>标题</label>
                <input type="text" id="configTitle" required />
              </div>
              <div class="form-group">
                <label class="checkbox-group">
                  <input type="checkbox" id="useEnglishNames" /> <span>使用英文名字</span>
                </label>
              </div>
              <div class="form-group">
                <label class="checkbox-group">
                  <input type="checkbox" id="showCountryName" /> <span>显示国家名 (需数据支持)</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Mappings -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">名字映射配置</div>
            <div class="config-section-content">
              <div class="form-group">
                <label>JSON格式</label>
                <textarea id="nameMapping" placeholder='{"标识": {"nameZh": "中文", "nameEn": "English"}}' style="min-height: 150px;"></textarea>
              </div>
            </div>
          </div>

          <!-- Colors -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">颜色配置</div>
            <div class="config-section-content">
              <div class="form-row">
                <div class="form-group"><label>默认</label><input type="color" id="colorDefault" /></div>
                <div class="form-group"><label>第一名</label><input type="color" id="colorFirstPlace" /></div>
              </div>
              <div class="form-group">
                <label>个别颜色映射 (JSON)</label>
                <textarea id="itemColors" placeholder='{"标识": "#ff0000"}'></textarea>
              </div>
            </div>
          </div>

          <!-- Data -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">数据配置</div>
            <div class="config-section-content">
              <div style="background: var(--bg-secondary); padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">💡 快速粘贴 (Excel/文本)</div>
                <textarea id="quickPasteArea" style="width: 100%; min-height: 100px; margin-bottom: 8px;" placeholder="名称	数值"></textarea>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-add" onclick="quickPasteToKeyframe()" style="flex: 1;">粘贴到最新时间点</button>
                    <button type="button" class="btn-secondary" onclick="clearQuickPaste()">清空</button>
                </div>
              </div>
              <div id="keyframesContainer"></div>
              <button type="button" class="btn-add" onclick="addKeyframe()">+ 添加时间点</button>
            </div>
          </div>

          <!-- Value Format -->
          <div class="config-section collapsed">
             <div class="config-section-title" onclick="toggleSection(this)">数值格式</div>
             <div class="config-section-content">
                <div class="form-row">
                    <div class="form-group"><label>前缀</label><input type="text" id="valuePrefix"></div>
                    <div class="form-group"><label>后缀</label><input type="text" id="valueSuffix"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>小数位</label><input type="number" id="valueDecimals" min="0" max="10"></div>
                    <div class="form-group" style="display:flex; align-items:center;"><label><input type="checkbox" id="valueUseCommas"> 千分位</label></div>
                </div>
             </div>
          </div>

          <!-- Animation -->
          <div class="config-section collapsed">
            <div class="config-section-title" onclick="toggleSection(this)">动画配置</div>
            <div class="config-section-content">
                <div class="form-row">
                    <div class="form-group"><label>过渡帧数</label><input type="number" id="animSteps" min="10"></div>
                    <div class="form-group"><label>每帧时长(ms)</label><input type="number" id="animDuration" min="500"></div>
                </div>
                <div class="form-group"><label>显示前N名</label><input type="number" id="animTopN" min="1"></div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <!-- Main Chart Content -->
    <div class="chart-container">
      <div class="controls">
        <button onclick="play()">播放</button>
        <button onclick="pause()">暂停</button>
        <button onclick="restart()">重播</button>
        <button onclick="document.getElementById('title').style.display = document.getElementById('title').style.display === 'none' ? 'block' : 'none'">标题开关</button>
        <button onclick="toggleLang()" id="langToggleBtn">切换语言</button>
      </div>
      
      <div class="chart-wrapper">
        <h1 id="title" contenteditable="true" oninput="handleTitleEdit(this.textContent)">Top Ranking</h1>
        <div class="chart" id="chart" style="width:100%; height:100%;">
          <!-- SVG will be appended here -->
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chart.js"></script>
    
    <script>
      // Global Lang Toggle Implementation
      function toggleLang() {
        if (!window.CONFIG) return;
        window.CONFIG.useEnglishNames = !window.CONFIG.useEnglishNames;
        const btn = document.getElementById("langToggleBtn");
        if (btn) btn.textContent = window.CONFIG.useEnglishNames ? "切换到中文" : "Switch to English";
        document.getElementById("useEnglishNames").checked = window.CONFIG.useEnglishNames;
        window.refreshChart();
      }

      // Start
      window.addEventListener('load', initChart);
    </script>
  </body>
</html>
